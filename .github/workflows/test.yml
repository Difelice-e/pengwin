name: Pengwin — verifiche

# Gira sulle sole parti pure: nessuna credenziale, nessuna rete, nessuna
# scrittura su Supabase. Serve a non scoprire in produzione una regressione in
# `aggancia()`, dove un errore non da' eccezione ma aggancia la partita
# sbagliata o lascia la quota NULL.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifiche:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Quote Betfair — commissione, stake, aggancio
        run: python tests/betfair.py
